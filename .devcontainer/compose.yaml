# Overlay on the root docker-compose.yml: adds the sandboxed workspace container.
# It reaches the other services by name on the compose network:
#   legacy app  http://legacy:8080
#   Postgres    postgres://petclinic:petclinic@db:5432/petclinic (RAG index in database "rag")
#   Ollama      http://ollama:11434 (local embeddings for the search_legacy_code MCP tool)
# No Docker socket is mounted, so the agent cannot control Docker.
# Relative paths resolve from the repo root (the first compose file's directory).
services:
  workspace:
    build:
      context: .devcontainer
      dockerfile: Dockerfile
    command: sleep infinity
    cap_add:
      - NET_ADMIN   # needed by init-firewall.sh (iptables)
      - NET_RAW
    environment:
      DATABASE_URL: postgres://petclinic:petclinic@db:5432/petclinic
      LEGACY_URL: http://legacy:8080
      RAG_DATABASE_URL: postgres://petclinic:petclinic@db:5432/rag
      OLLAMA_URL: http://ollama:11434
      NODE_OPTIONS: --max-old-space-size=4096
      CLAUDE_CONFIG_DIR: /home/node/.claude
    volumes:
      - .:/workspace:cached
      # The host orchestrator runs git in this same checkout with the human's GitHub login.
      # Read-only config and hooks stop the agent from planting commands (hooks, core.fsmonitor,
      # credential helpers) that the host's git would execute.
      - ./.git/config:/workspace/.git/config:ro
      - ./.git/hooks:/workspace/.git/hooks:ro
      - claude-config:/home/node/.claude
    depends_on:
      db:
        condition: service_healthy
      legacy:
        condition: service_started
      ollama:
        condition: service_started

volumes:
  claude-config:
